# Non-secret configuration for the avtools SNMP job.
# Secrets (DATABASE_URL, MONIT_PASSWORD) go in a separate Secret — see README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: avtools-config
  labels:
    app: avtools
data:
  MONIT_TENANT: "avtools"
  MONIT_OTLP_ENDPOINT: "monit-otlp.cern.ch:4316"
  MONIT_OTLP_INSECURE: "true"
  # Start on qa; flip to "prod" once a full sharded cycle looks healthy.
  AVTOOLS_ENVIRONMENT: "qa"
  AVTOOLS_HOSTGROUP: "itdcim/av"
  AVTOOLS_AVAILABILITY_ZONE: "cern-geneva-b"
  OTEL_SERVICE_NAME: "avtools"
