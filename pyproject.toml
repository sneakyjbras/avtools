[tool.poetry]
name        = "avtools"
version     = "1.6.0"
description = "Monitoring tools for the AV infrastructure of CERN."
readme      = "README.md"
license     = "Proprietary"
homepage    = "https://gitlab.cern.ch/itdcim/av-tools"
repository  = "https://gitlab.cern.ch/itdcim/av-tools.git"

authors = [
    "jsapinat <jose.bras@cern.ch>",
    "zembrzus <pawel.zembrzuski@cern.ch>",
    "jpolok <jarek.polok@cern.ch>",
]

# Ship vendored MIB sources + the compiled metadata the resolver loads at runtime.
include = [
    { path = "src/avtools/mibs/compiled/*.metadata.json", format = ["sdist", "wheel"] },
    { path = "src/avtools/mibs/sources/*", format = ["sdist", "wheel"] },
    { path = "src/avtools/mibs/reference/*", format = ["sdist", "wheel"] },
    { path = "src/avtools/mibs/*.md", format = ["sdist", "wheel"] },
]

[tool.poetry.urls]
Homepage   = "https://gitlab.cern.ch/itdcim/av-tools"
Repository = "https://gitlab.cern.ch/itdcim/av-tools.git"
Issues     = "https://gitlab.cern.ch/itdcim/av-tools/-/issues"


[[tool.poetry.source]]
name     = "pypiserver_qa"
url      = "https://qa-pypi-itdcim.cern.ch/simple"
priority = "supplemental"

[[tool.poetry.source]]
name     = "pypiserver"
url      = "https://pypi-itdcim.cern.ch/simple"
priority = "supplemental"


[tool.poetry.dependencies]
# Python runtime: 3.11 only (RHEL9 compatible)
python = ">=3.11,<3.12"

# Runtime dependencies (alphabetical)
cern-oauthlib     = ">=25,<26.5.3"
click             = "^8"
grpcio            = ">=1.50,<2"
loguru            = ">=0.7,<1"
opentelemetry-api = ">=1.20,<2"
opentelemetry-exporter-otlp-proto-grpc = ">=1.20,<2"
opentelemetry-sdk = ">=1.20,<2"
eam-rest-client   = ">=25"
landb-rest-client = ">=25"
pexpect           = ">=4.8.0,<5.0.0"
psycopg2-binary   = "^2.9.10"
pyasn1            = ">=0.4.8,<0.5.0"
pydantic          = ">=1.10,<2"
pysnmp            = "4.4.12"
requests          = "^2.31.0"
sqlalchemy        = "^2.0.39"
structlog         = "^25.1.0"


[[tool.poetry.packages]]
include = "avtools"
from    = "src"


[tool.poetry.scripts]
avtools          = "avtools.main:cli"
get-token        = "avtools.main:get_token"
precommit-checks = "avtools.devtools:precommit_checks"

[tool.poetry.group.lint.dependencies]
black          = "^25.1.0"
ruff           = "^0.11.7"
detect-secrets = "^1.5.0"


[tool.poetry.group.dev.dependencies]
ipdb         = "^0.13.13"
ipython      = "^8.32.0"
pre-commit   = "^4.1.0"
pysmi        = "*"  # used by scripts/compile_mibs.py to (re)generate MIB metadata
pytest       = "^9.0.1"
pytest-cov   = "^7.0.0"
pytest-mock  = "^3.15.1"


[tool.black]
line-length    = 100
target-version = ["py311"]
include        = '\.pyi?$'


[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]


[build-system]
requires      = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
