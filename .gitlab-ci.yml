image: python:3.11-slim

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

cache:
  paths:
    - .cache/pip
    - .cache/pypoetry
    - .venv

before_script:
  - python -m pip install --upgrade pip
  - pip install poetry
  - poetry --version
  - poetry install --with dev,lint

# ---------------- LINT JOB ----------------
lint:
  stage: lint
  script:
    - poetry run black --check .

  only:
    - merge_requests
    - main
    - develop

# ---------------- UNIT TEST JOB ----------------
unit_tests:
  stage: test
  script:
    - poetry run pytest tests -vv --disable-warnings --junitxml=pytest-unit.xml

  artifacts:
    when: always
    reports:
      junit: pytest-unit.xml
  only:
    - merge_requests
    - main
    - develop
