include:
  - project: "itdcim/itdcim-ci-templates"
    ref: master
    file: "templates/python/poetry-test-and-publish-with-koji.yaml"

variables:
  # Shared Python template variables
  PYPI_BUILD_IMAGE: "python:3.11-slim"
  POETRY_VERSION: "2.1.1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

  # Grafana (MonIT) base URL
  GRAFANA_URL: "https://monit-grafana.cern.ch"

cache:
  paths:
    - .cache/pip
    - .cache/pypoetry
    - .venv

# Keep the rpm-ci stage names so inherited jobs validate cleanly.
# The local visible flow remains centered on explicit lint/test jobs,
# while PyPI publishing is disabled below.
stages:
  - prebuild
  - srpm
  - rpm
  - lint
  - prekoji
  - koji_scratch
  - pretest
  - test
  - integration
  - e2e
  - posttest
  - koji_build
  - postkoji
  - docker_prepare
  - docker_build
  - docker_test
  - deploy_qa
  - postqa
  - deploy_stable
  - postdeploy

# --------------------------------------------------
# Neutralize inherited PyPI-oriented jobs
# --------------------------------------------------
python-tests:
  rules:
    - when: never

python-publish-qa:
  rules:
    - when: never

python-publish-stable:
  rules:
    - when: never

.python-test-base:
  extends: .python-base
  before_script:
    - pip install "poetry==$POETRY_VERSION"
    - poetry install --with dev,lint

lint:
  extends: .python-test-base
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_TAG'
  script:
    - poetry run black --check .

unit_tests:
  extends: .python-test-base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_TAG'
  script:
    - poetry run pytest --disable-warnings --junitxml=pytest-unit.xml --cov=avtools --cov-report=xml:coverage.xml
  artifacts:
    when: always
    reports:
      junit: pytest-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

integration_tests:
  extends: .python-test-base
  stage: integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true
  script:
    - poetry run pytest tests/integration --disable-warnings --junitxml=pytest-integration.xml
  artifacts:
    when: always
    reports:
      junit: pytest-integration.xml

e2e_tests:
  extends: .python-test-base
  stage: e2e
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true
  script:
    - poetry run pytest tests/system --disable-warnings --junitxml=pytest-e2e.xml
  artifacts:
    when: always
    reports:
      junit: pytest-e2e.xml

# ----------------------------
# Grafana GitOps validation
# ----------------------------
grafana_validate_json:
  stage: lint
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      set -eu
      for f in grafana/alerts/*.json grafana/dashboard/prod/*.json grafana/dashboard/qa/*.json; do
        [ -e "$f" ] || continue
        python -m json.tool "$f" >/dev/null
      done

# ----------------------------
# Deploy dashboards + alerts to QA on EVERY push to "development"
# QA folder UID: 7BZSQJX4z (playground)
# QA Postgres datasource UID: dfaue906qonpcf  (AV Stats QA)
# QA Contact point: "AV Test"
# ----------------------------
deploy_grafana_qa:
  stage: deploy_qa
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: on_success
    - when: never
  environment:
    name: grafana/qa
    url: https://monit-grafana.cern.ch/dashboards/f/7BZSQJX4z/?orgId=12
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates
    - chmod +x scripts/sync_grafana_dashboards.sh scripts/sync_grafana_rulegroup.sh scripts/sync_grafana_rulegroup_qa.sh
    - ': "${GRAFANA_API_TOKEN_QA:?Missing required CI/CD variable GRAFANA_API_TOKEN_QA}"'
    - export GRAFANA_API_TOKEN="$GRAFANA_API_TOKEN_QA"
  script:
    - ./scripts/sync_grafana_dashboards.sh put qa
    - ./scripts/sync_grafana_rulegroup_qa.sh put

# ----------------------------
# Deploy dashboards + alerts to PROD ONLY on tags
# PROD folder UID: beuar1of5bo5cf (av-dashboard)
# PROD Postgres datasource UID: ed690575-af6b-41b8-a72d-81f47592f349 (AV Stats / prod)
# PROD Contact point: "AV Tools"
# ----------------------------
deploy_grafana_prod:
  stage: deploy_stable
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  environment:
    name: grafana/prod
    url: https://monit-grafana.cern.ch/dashboards/f/beuar1of5bo5cf/?orgId=12
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates
    - chmod +x scripts/sync_grafana_dashboards.sh scripts/sync_grafana_rulegroup.sh scripts/sync_grafana_rulegroup_qa.sh
    - ': "${GRAFANA_API_TOKEN_PROD:?Missing required CI/CD variable GRAFANA_API_TOKEN_PROD}"'
    - export GRAFANA_API_TOKEN="$GRAFANA_API_TOKEN_PROD"
  script:
    - ./scripts/sync_grafana_dashboards.sh put prod
    - ./scripts/sync_grafana_rulegroup.sh prod
