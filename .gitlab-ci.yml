include:
  - project: "itdcim/itdcim-ci-templates"
    ref: master
    file: "templates/python/poetry-test-and-publish-with-koji.yaml"

variables:
  # Shared Python template variables
  PYPI_BUILD_IMAGE: "python:3.11-slim"
  POETRY_VERSION: "2.1.1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

  # Grafana (MonIT) base URL
  GRAFANA_URL: "https://monit-grafana.cern.ch"

cache:
  paths:
    - .cache/pip
    - .cache/pypoetry
    - .venv

# --------------------------------------------------
# Pipeline de-duplication.
#
# Root cause of "lint runs twice": with `rules: - when: always`, a push to a
# branch that has an open MR produced BOTH a branch pipeline AND a merge-request
# pipeline, so every always-on job (lint/check/grafana/mibs) ran in each.
#
# This workflow runs the MR pipeline when an MR is open and suppresses the
# redundant branch pipeline; branches without an MR still run a branch pipeline;
# tags and web (manual publish) pipelines are allowed.
# --------------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Keep the rpm-ci stage names so inherited jobs validate cleanly.
stages:
  - prebuild
  - srpm
  - rpm
  - lint
  - prekoji
  - koji_scratch
  - pretest
  - test
  - integration
  - e2e
  - posttest
  - koji_build
  - postkoji
  - docker_prepare
  - docker_build
  - docker_test
  - deploy_qa
  - postqa
  - deploy_stable
  - postdeploy

# --------------------------------------------------
# Neutralize inherited template jobs not used here
# (koji/rpm pipeline and generic python-tests)
# --------------------------------------------------
python-tests:
  rules:
    - when: never

# --------------------------------------------------
# Shared Python base (extends the template's .python-base)
# --------------------------------------------------
.python-test-base:
  extends: .python-base
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - pip install "poetry==$POETRY_VERSION"
    - poetry install --with dev,lint

# ==================================================
# EVERY COMMIT — check + lint + grafana JSON
# Runs on all branch pushes, MR events, tags, and
# scheduled/manual pipelines alike.
# ==================================================

# Secret scanning: detect-secrets against the committed baseline.
# Any new (file, line, type) tuple not already reviewed fails the job.
# To accept a new finding locally:
#   1. poetry run detect-secrets scan > .secrets.baseline
#   2. poetry run detect-secrets audit .secrets.baseline
#   3. Commit the updated baseline.
check:
  extends: .python-test-base
  stage: lint
  rules:
    - when: always
  script:
    - poetry run detect-secrets scan --exclude-files '\.secrets\.baseline' > /tmp/secrets-current.json
    - |
      python3 - <<'PYEOF'
      import json, sys

      curr = json.load(open('/tmp/secrets-current.json')).get('results', {})
      base = json.load(open('.secrets.baseline')).get('results', {})

      new_findings = []
      for filepath, secrets in curr.items():
          known = {(s['line_number'], s['type']) for s in base.get(filepath, [])}
          for s in secrets:
              if (s['line_number'], s['type']) not in known:
                  new_findings.append(f"  {filepath}:{s['line_number']} [{s['type']}]")

      if new_findings:
          print("FAIL – unreviewed secret(s) found:", file=sys.stderr)
          for item in new_findings:
              print(item, file=sys.stderr)
          print(
              "\nRun locally:\n"
              "  poetry run detect-secrets scan > .secrets.baseline\n"
              "  poetry run detect-secrets audit .secrets.baseline\n"
              "then commit the updated baseline.",
              file=sys.stderr,
          )
          sys.exit(1)

      reviewed = sum(len(v) for v in base.values())
      print(f"OK – no unreviewed secrets ({reviewed} reviewed entries in baseline)")
      PYEOF

# Python formatting (Black) + linting (Ruff) — both tools, every commit.
lint:
  extends: .python-test-base
  stage: lint
  rules:
    - when: always
  script:
    - poetry run black --check src tests scripts
    - poetry run ruff check src tests scripts

# Structural JSON validation for all Grafana dashboard and alert files.
grafana_validate_json:
  stage: lint
  image: python:3.11-slim
  rules:
    - when: always
  script:
    - |
      set -eu
      fail=0
      for f in grafana/alerts/*.json grafana/dashboard/prod/*.json grafana/dashboard/qa/*.json; do
        [ -e "$f" ] || continue
        if python -m json.tool "$f" >/dev/null 2>&1; then
          echo "OK  $f"
        else
          echo "FAIL $f"
          fail=1
        fi
      done
      exit $fail

# Ensure the committed MIB metadata matches a fresh compile of the vendored
# sources (so handlers' MIB-backed mode never drifts from the .mib files).
mibs_compile_check:
  extends: .python-test-base
  stage: lint
  rules:
    - when: always
  script:
    - poetry run python scripts/compile_mibs.py --check

# ==================================================
# FEATURE BRANCHES (MR) + MASTER + TAGS — unit tests
#
# Triggered by:
#   • Any merge request event (feature branch → master)
#   • Every direct push to master
#   • Every Git tag (gates the publish jobs, which also fire on tags)
# ==================================================
unit_tests:
  extends: .python-test-base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'   # every branch (qa, master, feature branches)
    - if: '$CI_COMMIT_TAG'
  script:
    - poetry run pytest tests/unit tests/cli --disable-warnings --junitxml=pytest-unit.xml --cov=avtools --cov-report=xml:coverage.xml
  artifacts:
    when: always
    reports:
      junit: pytest-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ==================================================
# MR + MASTER + TAGS — integration → e2e  (automatic)
#
# integration_tests: MR + master, automatic, allow_failure.
#   Depends on live infrastructure (SNMP targets, Postgres), so a downed
#   endpoint must not block an MR or master. Runs for visibility; does not
#   gate merges or downstream stages.
#
# e2e_tests: MR + master + tags + web, automatic, BLOCKING (no allow_failure).
#   Hard gate in front of the publish jobs. NOTE: because it is blocking and
#   now also runs on MRs, an infra-down / failing e2e run will block the MR.
#   To keep e2e non-blocking on MRs only, add `allow_failure: true` to the
#   merge_request_event rule below.
# ==================================================
integration_tests:
  extends: .python-test-base
  stage: integration
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "qa"'
    - if: '$CI_COMMIT_TAG'
  script:
    - poetry run pytest tests/integration --disable-warnings --junitxml=pytest-integration.xml
  artifacts:
    when: always
    reports:
      junit: pytest-integration.xml

e2e_tests:
  extends: .python-test-base
  stage: e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "qa"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
  script:
    - poetry run pytest tests/system --disable-warnings --junitxml=pytest-e2e.xml
  artifacts:
    when: always
    reports:
      junit: pytest-e2e.xml

# ==================================================
# GRAFANA GITOPS
#
# Required CI/CD variables — set in:
#   GitLab → Settings → CI/CD → Variables
#
#   GRAFANA_API_TOKEN_QA   – service account token for the QA Grafana org
#   GRAFANA_API_TOKEN_PROD – service account token for the PROD Grafana org
#
# ⚠  COMMON CAUSE OF "Missing required CI/CD variable GRAFANA_API_TOKEN_PROD":
#     The variable exists in GitLab but is flagged as "Protected".
#     Protected variables are only injected into protected branches/tags.
#     Fix (choose one):
#       A) Uncheck "Protected" on the variable in GitLab → Settings → CI/CD → Variables
#       B) Protect the tag that triggers this job:
#          GitLab → Settings → Repository → Protected Tags → add your tag pattern (e.g. v*)
# ==================================================
deploy_grafana_qa:
  stage: deploy_qa
  image: python:3.11-slim
  # QA deploys: optional manual job on commits/merges to `qa` AND on tag
  # pipelines, so a tagged release can be validated in QA before the PROD
  # (tag-only) buttons are used. allow_failure keeps it non-blocking.
  rules:
    - if: '$CI_COMMIT_BRANCH == "qa"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - when: never
  environment:
    name: grafana/qa
    url: https://monit-grafana.cern.ch/dashboards/f/7BZSQJX4z/?orgId=12
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
    - chmod +x scripts/sync_grafana_dashboards.sh scripts/sync_grafana_rulegroup.sh scripts/sync_grafana_rulegroup_qa.sh
    - |
      : "${GRAFANA_API_TOKEN_QA:?
      GRAFANA_API_TOKEN_QA is not set or not visible to this pipeline.
      → Go to GitLab → Settings → CI/CD → Variables and add GRAFANA_API_TOKEN_QA.
      → If it is already there and marked Protected, either uncheck Protected
        or protect the 'qa' branch (Settings → Repository → Protected Branches).}"
    - export GRAFANA_API_TOKEN="$GRAFANA_API_TOKEN_QA"
  script:
    - ./scripts/sync_grafana_dashboards.sh put qa

deploy_grafana_prod:
  stage: deploy_stable
  image: python:3.11-slim
  # PROD deploys are release-time: offered as an optional manual job only on tag
  # pipelines, since a tag is the promote-to-production signal. allow_failure
  # keeps it non-blocking. Non-tag pipelines don't show this job at all.
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - when: never
  environment:
    name: grafana/prod
    url: https://monit-grafana.cern.ch/dashboards/f/beuar1of5bo5cf/?orgId=12
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
    - chmod +x scripts/sync_grafana_dashboards.sh scripts/sync_grafana_rulegroup.sh scripts/sync_grafana_rulegroup_qa.sh
    - |
      : "${GRAFANA_API_TOKEN_PROD:?
      GRAFANA_API_TOKEN_PROD is not set or not visible to this pipeline.
      → Go to GitLab → Settings → CI/CD → Variables and add GRAFANA_API_TOKEN_PROD.
      → If it is already there and marked Protected, either uncheck Protected
        or protect the tag that triggered this job
        (Settings → Repository → Protected Tags → add your tag pattern, e.g. v*).}"
    - export GRAFANA_API_TOKEN="$GRAFANA_API_TOKEN_PROD"
  script:
    - ./scripts/sync_grafana_dashboards.sh put prod

# ==================================================
# GRAFANA ALERT RULE GROUPS  (separate, manual)
#
# Publishing alert rule groups is intentionally split out from the dashboard
# deploy jobs above so alerts can be shipped independently and only when
# explicitly triggered. Both jobs are manual.
#
#   deploy_grafana_alerts_qa   -> QA org   (folder: playground / 7BZSQJX4z)
#                                 receiver "AV Test",  Postgres dfaue906qonpcf
#   deploy_grafana_alerts_prod -> PROD org (folder: av-dashboard / beuar1of5bo5cf)
#                                 receiver "AV Tools", Postgres ed690575-...
#
# Each job publishes EVERY grafana/alerts/*.rulegroup.PUT.json. The QA payloads
# are derived from the PROD sources at deploy time by patch_grafana_rulegroup.py
# (no hand-maintained QA files).
#
# Same GRAFANA_API_TOKEN_QA / GRAFANA_API_TOKEN_PROD variables as the dashboard
# jobs (see the Protected-variable note above).
# ==================================================
deploy_grafana_alerts_qa:
  stage: deploy_qa
  image: python:3.11-slim
  # QA deploys: optional manual job on commits/merges to `qa` AND on tag
  # pipelines, so a tagged release can be validated in QA before the PROD
  # (tag-only) buttons are used. allow_failure keeps it non-blocking.
  rules:
    - if: '$CI_COMMIT_BRANCH == "qa"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - when: never
  environment:
    name: grafana/qa
    url: https://monit-grafana.cern.ch/dashboards/f/7BZSQJX4z/?orgId=12
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates python3
    - chmod +x scripts/sync_grafana_rulegroup.sh scripts/sync_grafana_rulegroup_qa.sh
    - |
      : "${GRAFANA_API_TOKEN_QA:?
      GRAFANA_API_TOKEN_QA is not set or not visible to this pipeline.
      → Go to GitLab → Settings → CI/CD → Variables and add GRAFANA_API_TOKEN_QA.
      → If it is already there and marked Protected, either uncheck Protected
        or protect the 'qa' branch (Settings → Repository → Protected Branches).}"
    - export GRAFANA_API_TOKEN="$GRAFANA_API_TOKEN_QA"
  script:
    - ./scripts/sync_grafana_rulegroup_qa.sh put

deploy_grafana_alerts_prod:
  stage: deploy_stable
  image: python:3.11-slim
  # PROD deploys are release-time: offered as an optional manual job only on tag
  # pipelines, since a tag is the promote-to-production signal. allow_failure
  # keeps it non-blocking. Non-tag pipelines don't show this job at all.
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - when: never
  environment:
    name: grafana/prod
    url: https://monit-grafana.cern.ch/dashboards/f/beuar1of5bo5cf/?orgId=12
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates python3
    - chmod +x scripts/sync_grafana_rulegroup.sh scripts/sync_grafana_rulegroup_qa.sh
    - |
      : "${GRAFANA_API_TOKEN_PROD:?
      GRAFANA_API_TOKEN_PROD is not set or not visible to this pipeline.
      → Go to GitLab → Settings → CI/CD → Variables and add GRAFANA_API_TOKEN_PROD.
      → If it is already there and marked Protected, either uncheck Protected
        or protect the tag that triggered this job
        (Settings → Repository → Protected Tags → add your tag pattern, e.g. v*).}"
    - export GRAFANA_API_TOKEN="$GRAFANA_API_TOKEN_PROD"
  script:
    - ./scripts/sync_grafana_rulegroup.sh prod

# ==================================================
# PYPI PUBLISHING
#
# Publishes the avtools package to the internal CERN PyPI servers.
#
#   python-publish-qa     → QA PyPI   (https://qa-pypi-itdcim.cern.ch)
#                           triggers on every push to the 'qa' branch
#   python-publish-stable → PROD PyPI (https://pypi-itdcim.cern.ch)
#                           triggers on every Git tag
#
# Required CI/CD variables — set in GitLab → Settings → CI/CD → Variables.
# Poetry reads these automatically based on the repository name:
#
#   QA   (repository name: pypiserver_qa):
#     POETRY_HTTP_BASIC_PYPISERVER_QA_USERNAME
#     POETRY_HTTP_BASIC_PYPISERVER_QA_PASSWORD
#
#   PROD (repository name: pypiserver):
#     POETRY_HTTP_BASIC_PYPISERVER_USERNAME
#     POETRY_HTTP_BASIC_PYPISERVER_PASSWORD
#
# If your private PyPI uses token auth instead of basic auth, set:
#   POETRY_PYPI_TOKEN_PYPISERVER_QA   (QA)
#   POETRY_PYPI_TOKEN_PYPISERVER      (PROD)
# ==================================================
python-publish-qa:
  extends: .python-test-base
  stage: deploy_qa
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+/'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  script:
    # Register the QA upload endpoint (upload URL differs from /simple install URL)
    - poetry config repositories.pypiserver_qa https://qa-pypi-itdcim.cern.ch
    - poetry config http-basic.pypiserver_qa "$PYPISERVER_USER" "$PYPISERVER_PASS"
    - poetry build
    - poetry publish -r pypiserver_qa

python-publish-stable:
  extends: .python-test-base
  stage: deploy_stable
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+/'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  script:
    # Register the PROD upload endpoint
    - poetry config repositories.pypiserver https://pypi-itdcim.cern.ch
    - poetry config http-basic.pypiserver "$PYPISERVER_USER" "$PYPISERVER_PASS"
    - poetry build
    - poetry publish -r pypiserver

# ==================================================
# CONTAINER IMAGE (Kubernetes / Magnum)
#
# Builds deploy/k8s/Dockerfile with kaniko and pushes to registry.cern.ch
# (Harbor). QA and PROD pull from the matching ITDCIM PyPI index (build arg).
# Moving env tags (:qa, :prod) let ArgoCD avoid per-SHA image-bump commits.
#
# Required CI/CD variables (masked+protected):
#   REGISTRY_PASSWORD  – registry.cern.ch Harbor robot token
#   (REGISTRY_USER is hardcoded in .kaniko-base: its literal '$' would be
#    mangled by GitLab variable expansion.)
# ==================================================
.kaniko-base:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - |
      : "${REGISTRY_PASSWORD:?set REGISTRY_PASSWORD (Harbor robot token)}"
      mkdir -p /kaniko/.docker
      # Harbor robot username. CERN's Harbor uses the 'robot-<project>+<name>' form
      # (a hyphen, no '$'). Hardcoded because it is not secret (only the token is),
      # which also keeps it out of GitLab variable expansion. Only REGISTRY_PASSWORD
      # stays a CI variable.
      REGISTRY_USER='robot-avtools+avtools-ci'
      AUTH=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"registry.cern.ch":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json

docker_build_qa:
  extends: .kaniko-base
  stage: docker_build
  # Decouple from the stage-ordered pipeline: an empty `needs` lets this job
  # start at pipeline creation instead of waiting for srpm/rpm/koji/test/.../
  # docker_prepare (~14 stages). The image is a self-contained from-source
  # build (kaniko runs `poetry build` inside the Dockerfile), so it consumes
  # no artifact from any earlier stage. QA is the fast lane; check/lint/unit/
  # e2e still run in parallel on the same pipeline and surface failures there.
  needs: []
  # Also build+publish the image directly from the k8s buildout feature branch,
  # so the :qa image can be produced WITHOUT merging the branch into the
  # protected qa/master release branches (image validation on the feature branch).
  # Two rule lines are needed because of the workflow: block above (the standard
  # "avoid duplicate pipelines" pattern): a plain BRANCH pipeline exposes
  # $CI_COMMIT_BRANCH, but once an MR is open for the branch only a
  # merge_request_event pipeline runs and $CI_COMMIT_BRANCH is unset there —
  # so the feature branch is matched via $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME too.
  rules:
    - if: '$CI_COMMIT_BRANCH == "qa" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "feature/k8s-image-build"'
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "feature/k8s-image-build"'
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg AVTOOLS_INDEX_URL=https://qa-pypi-itdcim.cern.ch/simple \
        --destination registry.cern.ch/avtools/avtools:qa \
        --destination registry.cern.ch/avtools/avtools:qa-$CI_COMMIT_SHORT_SHA

docker_build_prod:
  extends: .kaniko-base
  stage: docker_build
  # PROD publishes the moving :prod tag that ArgoCD auto-deploys to production,
  # so gate it on the blocking e2e job rather than building unconditionally.
  # This still skips every koji/rpm/srpm/integration stage. optional+artifacts:
  # false keep it robust (no failure if e2e is absent) and avoid pulling the
  # junit artifact into the kaniko build context.
  # For a fully-immediate PROD build, replace the four lines below with:
  #   needs: []
  needs:
    - job: e2e_tests
      optional: true
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+/'
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg AVTOOLS_INDEX_URL=https://pypi-itdcim.cern.ch/simple \
        --destination registry.cern.ch/avtools/avtools:prod \
        --destination registry.cern.ch/avtools/avtools:$CI_COMMIT_TAG

# ==================================================
# SENTRY RELEASES  (CERN Sentry SaaS, https://cern.sentry.io)
#
# GitLab has no native Sentry release integration, so we script sentry-cli:
# create the release, associate commits, finalize, and mark the env deploy.
# Skips cleanly until the project is created and its token is set.
#
# Required CI/CD variables (masked): SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT
# ==================================================
.sentry-release:
  image: getsentry/sentry-cli:2
  variables:
    SENTRY_URL: "https://cern.sentry.io"
  script:
    - |
      if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
        echo "Sentry vars not set — skipping release (request the project from IT-PW)."; exit 0
      fi
      sentry-cli releases new "$VERSION"
      sentry-cli releases set-commits --auto "$VERSION" || true
      sentry-cli releases finalize "$VERSION"
      sentry-cli releases deploys "$VERSION" new -e "$SENTRY_ENV"

sentry_release_qa:
  extends: .sentry-release
  stage: postqa
  variables:
    SENTRY_ENV: qa
  rules:
    - if: '$CI_COMMIT_BRANCH == "qa" || $CI_COMMIT_BRANCH == "master"'
  before_script:
    - export VERSION="avtools@qa-$CI_COMMIT_SHORT_SHA"

sentry_release_prod:
  extends: .sentry-release
  stage: postdeploy
  variables:
    SENTRY_ENV: prod
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+/'
  before_script:
    - export VERSION="avtools@$CI_COMMIT_TAG"
