include:
  - project: "itdcim/itdcim-ci-templates"
    ref: master
    file: "templates/python/poetry-test-and-publish-with-koji.yaml"
  - remote: "https://gitlab.cern.ch/linuxsupport/rpmci/raw/master/rpm-ci.yml"

variables:
  PYPI_BUILD_IMAGE: "python:3.11-slim"
  POETRY_VERSION: "2.1.1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

cache:
  paths:
    - .cache/pip
    - .cache/pypoetry
    - .venv

stages:
  - prebuild
  - lint
  - test
  - integration
  - e2e
  - build
  - koji_build
  - koji_install
  - deploy_qa
  - deploy_stable

python-tests:
  rules:
    - when: never

.python-test-base:
  extends: .python-base
  before_script:
    - poetry install --with dev,lint

lint:
  extends: .python-test-base
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  script:
    - poetry run black --check .

unit_tests:
  extends: .python-test-base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  script:
    - poetry run pytest tests \
        --disable-warnings \
        --junitxml=pytest-unit.xml \
        --cov=avtools \
        --cov-report=xml:coverage.xml
  artifacts:
    when: always
    reports:
      junit: pytest-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

integration_tests:
  extends: .python-test-base
  stage: integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true
  script:
    - poetry run pytest tests/integration \
        --disable-warnings \
        --junitxml=pytest-integration.xml
  artifacts:
    when: always
    reports:
      junit: pytest-integration.xml

e2e_tests:
  extends: .python-test-base
  stage: e2e
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true
  script:
    - poetry run pytest tests/e2e \
        --disable-warnings \
        --junitxml=pytest-e2e.xml
  artifacts:
    when: always
    reports:
      junit: pytest-e2e.xml
